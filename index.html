<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Price Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <!-- BootstrapVue CSS -->
    <link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap-vue@2.23.1/dist/bootstrap-vue.min.css" />

    <style>
    .nowrap {
        white-space: nowrap;
    }
    .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
    }
    .openrouter-id {
        font-family: monospace;
        font-size: small;
    }
    </style>
</head>
<body>

<b-container id="app" fluid class="mt-3">
    <h2>OpenRouter Price Calculator</h2>

    <b-card class="m-3" header="Settings" bg-variant="light">
        <b-form>
            <!-- Row 1: Input & Output Tokens -->
            <b-row>
                <b-col cols="12" md="6" class="mb-3">
                    <b-form-group label="Input Tokens:" label-for="input-tokens" class="mb-0">
                        <b-form-input id="input-tokens" v-model.number="inputTokens" type="number" min="0"></b-form-input>
                    </b-form-group>
                </b-col>
                <b-col cols="12" md="6" class="mb-3">
                    <b-form-group label="Output Tokens:" label-for="output-tokens" class="mb-0">
                        <b-form-input id="output-tokens" v-model.number="outputTokens" type="number" min="0"></b-form-input>
                    </b-form-group>
                </b-col>
            </b-row>
            
            <!-- Row 2: API Call Count & Filter -->
            <b-row>
                <b-col cols="12" md="6" class="mb-3">
                    <b-form-group label="API Call Count:" label-for="api-calls" class="mb-0">
                         <b-form-input id="api-calls" v-model.number="apiCalls" type="number" min="1"></b-form-input>
                    </b-form-group>
                </b-col>
                <b-col cols="12" md="6" class="mb-3">
                    <b-form-group label="Filter:" label-for="filter-text" class="mb-0">
                        <b-form-input id="filter-text" v-model="filterText" type="text" placeholder="Search model or ID..." debounce="100"></b-form-input>
                    </b-form-group>
                </b-col>
            </b-row>

            <!-- Row 3: Include Free Models -->
            <b-row>
                <b-col cols="12">
                    <b-form-checkbox id="includeFreeModels" name="includeFreeModels" v-model="includeFreeModels">
                        Include Free Models
                    </b-form-checkbox>
                </b-col>
            </b-row>
        </b-form>
    </b-card>

    <div v-if="isLoading" class="loading-spinner">
        <b-spinner label="Loading models..."></b-spinner>
        <span class="ml-2">Loading models from OpenRouter...</span>
    </div>

    <b-alert v-if="error" variant="danger" show>{{ error }}</b-alert>

    <div v-if="!isLoading && !error">
        <div class="d-flex justify-content-between align-items-center mb-2 mx-3">
            <h3>Language Model Prices</h3>
            <span v-if="filterText" class="badge badge-info">
                Found {{ calculatedModels.length }} models matching filters
            </span>
        </div>
        
        <b-table small striped hover bordered responsive
            :items="calculatedModels" :fields="fields"
            :sort-by.sync="sortBy" :sort-desc.sync="sortDesc"
            primary-key="id">
             <template #cell(name)="data">
                <span class="nowrap">{{ data.value }}</span>
            </template>
             <template #cell(id)="data">
                <span class="openrouter-id">{{ data.value }}</span>
            </template>
             <template #cell(inputCost)="data">
                <span class="nowrap">{{ formatCurrency(data.value) }}</span>
            </template>
            <template #cell(outputCost)="data">
                 <span class="nowrap">{{ formatCurrency(data.value) }}</span>
            </template>
            <template #cell(totalCost)="data">
                 <span class="nowrap">{{ formatCurrency(data.value) }}</span>
            </template>
        </b-table>
    </div>

</b-container>

<!-- Vue.js -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<!-- BootstrapVue -->
<script src="https://unpkg.com/bootstrap-vue@2.23.1/dist/bootstrap-vue.min.js"></script>
<!-- Axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    new Vue({
        el: '#app',
        data: {
            inputTokens: 16384,
            outputTokens: 500,
            apiCalls: 1500,
            filterText: '', // Property to capture live filtering input
            includeFreeModels: false,
            models: [], // Raw data from API
            isLoading: true,
            error: null,
            sortBy: 'totalCost', // Default sort column
            sortDesc: false, // Default sort order (false = ascending)
            fields: [
                { key: 'name', label: 'Name', sortable: true },
                { key: 'id', label: 'OpenRouter ID', sortable: true },
                { key: 'inputCost', label: 'Input Price ($)', sortable: true, class: 'text-right' },
                { key: 'outputCost', label: 'Output Price ($)', sortable: true, class: 'text-right' },
                { key: 'totalCost', label: 'Total Price ($)', sortable: true, class: 'text-right' }
            ]
        },
        computed: {
            calculatedModels() {
                if (!this.models || this.models.length === 0)
                    return [];

                return this.models
                    .map(model => {
                        const promptPrice = parseFloat(model.pricing?.prompt) || 0;
                        const completionPrice = parseFloat(model.pricing?.completion) || 0;

                        // Calculate pricing
                        const inputCost = this.apiCalls * promptPrice * (this.inputTokens || 0);
                        const outputCost = this.apiCalls * completionPrice * (this.outputTokens || 0);
                        const totalCost = inputCost + outputCost;

                        // Create the table row object
                        return {
                            id: model.id, // Unique key
                            name: model.name || model.id,
                            inputCost: inputCost,
                            outputCost: outputCost,
                            totalCost: totalCost,
                            _promptPricePerToken: promptPrice,
                            _completionPricePerToken: completionPrice
                        };
                    })

                    // Filter free models, or models without price details.
                    .filter(model => (this.includeFreeModels && model._promptPricePerToken >= 0 && model._completionPricePerToken >= 0)
                        || (model._promptPricePerToken > 0 || model._completionPricePerToken > 0))
                    
                    // Filter matching free-text search (case insensitive check on both name and ID)
                    .filter(model => {
                        if (!this.filterText) return true;
                        
                        const searchTerm = this.filterText.toLowerCase().trim();
                        const nameMatches = model.name && model.name.toLowerCase().includes(searchTerm);
                        const idMatches = model.id && model.id.toLowerCase().includes(searchTerm);
                        
                        return nameMatches || idMatches;
                    });
            }
        },
        methods: {
            async fetchModels() {
                this.isLoading = true;
                this.error = null;
                try {
                    const response = await axios.get('https://openrouter.ai/api/v1/models');
                    // Ensure the incoming data structure is using the expected format.
                    if (response.data && Array.isArray(response.data.data)) {
                        this.models = response.data.data;
                    } else {
                        console.error("Unexpected data format from API: ", response.data);
                        this.error = "Could not parse the OpenRouter API model list.";
                        this.models = []; // Empty the list if wrong format.
                    }
                } catch (err) {
                    console.error("Error during retrieval from OpenRouter API: ", err);
                    this.error = `Could not retrieve the model list from the OpenRouter API: ${err.message}. Please try again later.`;
                    this.models = []; // Empty the list if network issues etc.
                } finally {
                    this.isLoading = false;
                }
            },
            formatCurrency(value) {
                if (typeof value !== 'number' || isNaN(value))
                    return 'N/A';
                return `$${value.toFixed(3)}`;
            }
        },
        mounted() {
            // Retrieve OpenRouter model data when the component has mounted.
            this.fetchModels();
        }
    });
</script>

</body>
</html>
